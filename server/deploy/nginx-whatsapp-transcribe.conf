# /etc/nginx/sites-available/whatsapp-transcribe
#
# Hinweis: Auf diesem Server fangen die beiden Jellyfin-Configs mit
# `server_name _;` jeden unbekannten Hostnamen ab. Das ist hier unkritisch —
# nginx bevorzugt immer den exakten server_name-Treffer vor dem Default-Server.
# Wichtig ist nur, dass dieser Block per symlink in sites-enabled aktiv ist.

server {
    listen 80;
    listen [::]:80;
    server_name whisper.fherrmann.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name whisper.fherrmann.com;

    ssl_certificate     /etc/letsencrypt/live/whisper.fherrmann.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whisper.fherrmann.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Sprachmemos als base64 im JSON-Body — 32 MB Audio wachsen auf ~43 MB.
    client_max_body_size 48m;

    # Whisper braucht auf CPU je nach Modell deutlich laenger als die
    # nginx-Defaults von 60s erlauben.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 15s;

    access_log /var/log/nginx/whatsapp-transcribe.access.log;
    error_log  /var/log/nginx/whatsapp-transcribe.error.log;

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}

# Stufe 1 von 2 — /etc/nginx/sites-available/whatsapp-transcribe
#
# Nur Port 80, damit certbot seine HTTP-01-Challenge ablegen kann. Ohne
# diesen Block schlaegt die Challenge fehl: unbekannte Hostnamen bekommen
# auf diesem Server auf Port 80 keine brauchbare Antwort.
#
# Erst NACH `certbot certonly` die Vollversion einspielen — die verweist auf
# Zertifikatsdateien, die es vorher noch nicht gibt, und laesst `nginx -t`
# sonst fehlschlagen.

server {
    listen 80;
    listen [::]:80;
    server_name whisper.fherrmann.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 404;
    }
}

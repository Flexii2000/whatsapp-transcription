# /etc/nginx/snippets/whisper.conf
#
# Wird per include in den 443-Serverblock von
# /etc/nginx/sites-available/fherrmann.com eingebunden.
# Gleiches Muster wie /aspria/ und /wahlen.
#
# Anders als bei /wahlen hier MIT abschliessendem Slash an beiden Stellen:
# die FastAPI-App kennt keinen context-path, sie erwartet /transcribe und
# /health an der Wurzel. Der Slash an proxy_pass schneidet das /whisper/
# Praefix ab, aus /whisper/transcribe wird also /transcribe.

location = /whisper { return 301 /whisper/; }

location /whisper/ {
    proxy_pass http://127.0.0.1:8099/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # Sprachmemos als base64 im JSON-Body — 32 MB Audio wachsen auf ~43 MB.
    client_max_body_size 48m;

    # Whisper braucht auf CPU deutlich laenger als die nginx-Vorgabe von 60s.
    proxy_connect_timeout 15s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Streamen statt puffern: der Body wird nicht erst komplett
    # zwischengelagert, bevor er weitergereicht wird.
    proxy_request_buffering off;

    limit_req  zone=whisper_req burst=10 nodelay;
    limit_conn whisper_conn 4;
    limit_req_status  429;
    limit_conn_status 429;

    # Der Dienst hat keine Oberflaeche und gehoert in keinen Suchindex.
    add_header X-Robots-Tag        "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff"        always;
}

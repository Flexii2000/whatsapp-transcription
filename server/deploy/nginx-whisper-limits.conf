# /etc/nginx/conf.d/whisper-limits.conf
#
# Gehoert in den http-Kontext, deshalb conf.d/ und nicht snippets/.
# nginx.conf bindet conf.d/*.conf ein (Zeile 59), sites-enabled danach.
#
# Missbrauchsbremse: eine Transkription dauert Sekunden, 30 Anfragen pro
# Minute sind fuer einen Nutzer reichlich und deckeln trotzdem, was ein
# geleakter Token anrichten kann.

limit_req_zone  $binary_remote_addr zone=whisper_req:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=whisper_conn:10m;
